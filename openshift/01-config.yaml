apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-mcp-config
  namespace: superset-mcp
data:
  # Superset instance URL - update this to point to your OpenShift Superset instance
  SUPERSET_BASE_URL: "https://superset-your-domain.apps.cluster.example.com"
  # Note: Use either:
  #   Option 1: SUPERSET_ACCESS_TOKEN (recommended for long-term access)
  #   Option 2: SUPERSET_USERNAME + SUPERSET_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: superset-mcp-credentials
  namespace: superset-mcp
type: Opaque
stringData:
  # Option 1: Access Token (preferred for programmatic access)
  # SUPERSET_ACCESS_TOKEN: "your-access-token-here"
  # 
  # Option 2: Username/Password (will be used to obtain access token)
  SUPERSET_USERNAME: "admin"
  SUPERSET_PASSWORD: "your-password-here"
